# this_file: pyproject.toml
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vexy-dexypy"
dynamic = ["version"]
description = "Turn an HTML page into slide decks (PDF/SVG) through several engines at once."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adam Twardoch", email = "adam+github@twardoch.com" }]
keywords = ["slides", "pdf", "html", "presentation", "playwright", "reveal.js", "webflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "selectolax>=0.3.21",
    "pypdf>=5.0",
    "fire>=0.6",
    "loguru>=0.7",
    "rich>=13.7",
    "anyio>=4",
    # `live` fetch mode (the default, issue 103) drives a headless browser.
    "playwright>=1.48",
]

[project.optional-dependencies]
# Heavy / platform-specific engines kept optional so the core installs anywhere.
extract = ["trafilatura>=1.12"]
pdf = ["pikepdf>=9.4"]
vision = ["instructor>=1"]
all = [
    "playwright>=1.48",
    "trafilatura>=1.12",
    "pikepdf>=9.4",
]

[project.urls]
Documentation = "https://vexy.dev/vexy-dexypy/"
Homepage = "https://github.com/vexyart/vexy-dexypy"
Repository = "https://github.com/vexyart/vexy-dexypy"
Issues = "https://github.com/vexyart/vexy-dexypy/issues"
Changelog = "https://github.com/vexyart/vexy-dexypy/blob/main/CHANGELOG.md"

[project.scripts]
vexy-dexypy = "vexy_dexypy.__main__:main"

[project.entry-points."vexy_dexypy.readers"]
live = "vexy_dexypy.readers.live:LiveReader"
offline = "vexy_dexypy.readers.offline:OfflineReader"
static = "vexy_dexypy.readers.static:StaticReader"
dynamic = "vexy_dexypy.readers.dynamic:DynamicReader"

[project.entry-points."vexy_dexypy.importers"]
webflow = "vexy_dexypy.importers.webflow:WebflowImporter"
mkdocs-material = "vexy_dexypy.importers.mkdocs:MkdocsImporter"
docusaurus = "vexy_dexypy.importers.others:DocusaurusImporter"
bubble = "vexy_dexypy.importers.others:BubbleImporter"
framer = "vexy_dexypy.importers.others:FramerImporter"
generic = "vexy_dexypy.importers.generic:GenericImporter"

[project.entry-points."vexy_dexypy.exporters"]
playwright = "vexy_dexypy.exporters.playwright:PlaywrightExporter"
vivliostyle = "vexy_dexypy.exporters.vivliostyle:VivliostyleExporter"
reveal = "vexy_dexypy.exporters.reveal:RevealExporter"
prince = "vexy_dexypy.exporters.prince:PrinceExporter"
impress = "vexy_dexypy.exporters.impress:ImpressExporter"
marp = "vexy_dexypy.exporters.marp:MarpExporter"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# Git-tag-based semver written to a gitignored module at build time.
version-file = "src/vexy_dexypy/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vexy_dexypy"]
artifacts = ["src/vexy_dexypy/assets/**"]

[tool.hatch.build.targets.sdist]
include = [
    "src/vexy_dexypy",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["**/.DS_Store", "**/ruvector.db", "tests/**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
